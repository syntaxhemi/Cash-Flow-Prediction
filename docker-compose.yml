services:
  migrate:
    image: cash-flow-bootstrap:local
    build:
      context: .
      dockerfile: infra/docker/bootstrap.Dockerfile
    command: ["alembic", "-c", "infra/migrations/alembic.ini", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: cash_flow
    depends_on:
      postgres:
        condition: service_healthy

  platform-seed:
    image: cash-flow-bootstrap:local
    pull_policy: never
    command: ["python", "infra/seed/seed_platform.py"]
    restart: "no"
    environment:
      CASH_FLOW_API_URL: http://api:8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: cash_flow
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: cash-flow-api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "--app-dir", "apps/api/src", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: cash_flow
      EVENT_BROKER_HOST: redis
      EVENT_BROKER_PORT: 6379
      EVENT_BROKER_DB: 0
      INGESTION_UPLOAD_DIRECTORY: /var/uploads
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: cash-flow-worker
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "worker.main"]
    environment:
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: cash_flow
      EVENT_BROKER_HOST: redis
      EVENT_BROKER_PORT: 6379
      EVENT_BROKER_DB: 0
      INGESTION_UPLOAD_DIRECTORY: /var/uploads
    volumes:
      - upload_data:/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - default
      - erpnext_network

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: cash-flow-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: cash-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cash_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cash_flow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: cash-flow-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  erpnext-db:
    image: mariadb:11.8
    profiles: [erpnext]
    networks: [erpnext_network]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: admin
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - erpnext_db_data:/var/lib/mysql

  erpnext-redis-cache:
    image: redis:6.2-alpine
    profiles: [erpnext]
    networks: [erpnext_network]
    ports:
      - "6382:6379"

  erpnext-redis-queue:
    image: redis:6.2-alpine
    profiles: [erpnext]
    networks: [erpnext_network]
    ports:
      - "6383:6379"
    volumes:
      - erpnext_redis_queue_data:/data

  erpnext-configurator:
    image: frappe/erpnext:v16.31.1
    profiles: [erpnext]
    networks: [erpnext_network]
    entrypoint: [bash, -c]
    command:
      - >-
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      REDIS_CACHE: erpnext-redis-cache:6379
      REDIS_QUEUE: erpnext-redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs

  erpnext-create-site:
    image: frappe/erpnext:v16.31.1
    profiles: [erpnext]
    networks: [erpnext_network]
    entrypoint: [bash, -c]
    command:
      - >-
        wait-for-it -t 120 erpnext-db:3306;
        wait-for-it -t 120 erpnext-redis-cache:6379;
        wait-for-it -t 120 erpnext-redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for ERPNext common site configuration";
          sleep 5;
          if (( `date +%s`-start > 120 )); then exit 1; fi;
        done;
        if [ -d "sites/frontend" ]; then
          echo "ERPNext site already exists, skipping creation";
        else
          bench new-site frontend --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app erpnext --set-default;
        fi;
    environment:
      DB_HOST: erpnext-db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-db:
        condition: service_healthy
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs

  erpnext-backend:
    image: frappe/erpnext:v16.31.1
    profiles: [erpnext]
    networks: [erpnext_network]
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs

  erpnext-frontend:
    image: frappe/erpnext:v16.31.1
    profiles: [erpnext]
    networks: [erpnext_network]
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: erpnext-backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: erpnext-websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    depends_on:
      erpnext-backend:
        condition: service_started
      erpnext-websocket:
        condition: service_started
    ports:
      - "8090:8080"
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs

  erpnext-websocket:
    image: frappe/erpnext:v16.31.1
    profiles: [erpnext]
    networks: [erpnext_network]
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    environment:
      FRAPPE_REDIS_CACHE: redis://erpnext-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://erpnext-redis-queue:6379
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs

  erpnext-seed:
    image: cash-flow-bootstrap:local
    pull_policy: never
    command: ["python", "infra/seed/seed_erpnext.py"]
    profiles: [erpnext]
    restart: "no"
    environment:
      ERPNEXT_BASE_URL: http://erpnext-frontend:8080
      ERPNEXT_ADMIN_USER: Administrator
      ERPNEXT_ADMIN_PASSWORD: admin
      CASH_FLOW_API_URL: http://api:8000
      ERPNEXT_READY_TIMEOUT_SECONDS: "300"
      TRIGGER_ERPNEXT_SYNC: "true"
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
      erpnext-frontend:
        condition: service_started
      api:
        condition: service_healthy
      platform-seed:
        condition: service_completed_successfully
    networks:
      - default
      - erpnext_network

volumes:
  upload_data:
  postgres_data:
  redis_data:
  erpnext_db_data:
  erpnext_redis_queue_data:
  erpnext_sites:
  erpnext_logs:

networks:
  default:
    driver: bridge
  erpnext_network:
    driver: bridge
