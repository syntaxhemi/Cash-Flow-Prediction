repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: ["--allow-multiple-documents"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-format
        files: ^(apps/api|apps/worker|shared)/.*\.py$
      - id: ruff
        files: ^(apps/api|apps/worker|shared)/.*\.py$
        args: ["--fix"]

  - repo: local
    hooks:
      - id: prettier-dashboard
        name: prettier (dashboard)
        entry: npm --prefix apps/dashboard exec -- prettier --check apps/dashboard
        language: system
        files: ^apps/dashboard/.*\.(js|jsx|json|css|html|md|ya?ml)$
        exclude: ^apps/dashboard/(node_modules|dist)/

      - id: eslint-dashboard
        name: eslint (dashboard)
        entry: npm --prefix apps/dashboard exec eslint --max-warnings=0 apps/dashboard/src
        language: system
        files: ^apps/dashboard/src/.*\.(js|jsx)$
        exclude: ^apps/dashboard/(node_modules|dist)/
