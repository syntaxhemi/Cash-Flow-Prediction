[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cash-flow-worker"
version = "0.1.0"
description = "Async worker for the cash flow prediction platform."
requires-python = ">=3.13"
dependencies = [
  "cash-flow-database",
  "cash-flow-event-broker",
  "cash-flow-domain",
  "cash-flow-integrations",
  "cash-flow-schemas",
  "pydantic-settings",
  "redis",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
