[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cash-flow-schemas"
version = "0.1.0"
description = "Shared schema layer for the cash flow prediction platform."
requires-python = ">=3.13"
dependencies = [
  "cash-flow-domain",
  "pydantic",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]
