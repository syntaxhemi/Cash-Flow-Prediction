[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cash-flow-ml"
version = "0.1.0"
description = "Shared ML layer for the cash flow prediction platform."
requires-python = ">=3.13"
dependencies = [
  "cash-flow-database",
  "cash-flow-domain",
  "cash-flow-schemas",
  "numpy",
  "pandas",
  "scikit-learn",
  "torch",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
